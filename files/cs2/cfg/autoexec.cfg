// Alan's CS2 Autoexec Config
// Updated: 2026-08-25
// Place in: Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\autoexec.cfg
// Add +exec autoexec.cfg to CS2 launch options to ensure it loads.

// ========== Mouse / Sensitivity ==========
sensitivity "1.45"
m_rawinput "1"
m_customaccel "0"
m_yaw "0.022"
m_pitch "0.022"

// ========== Crosshair ==========
// Generated by crosshair generator
cl_crosshairalpha "255"
cl_crosshaircolor "4"
cl_crosshaircolor_b "50"
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "0"
cl_crosshairdot "0"
cl_crosshairgap "-2"
cl_crosshairsize "2"
cl_crosshairstyle "4"
cl_crosshairthickness "1"
cl_crosshairusealpha "1"
cl_crosshair_drawoutline "0"

// ========== Viewmodel ==========
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"
viewmodel_presetpos "0"
cl_righthand "1"

// ========== HUD ==========
cl_hud_color "6"
cl_hud_playercount_pos "1"
cl_hud_playercount_showcount "1"
cl_hud_healthammo_style "1"
cl_hud_bomb_under_radar "1"

// ========== Radar ==========
cl_radar_always_centered "0"
cl_radar_scale "0.35"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "1"
cl_radar_square_with_scoreboard "1"

// ========== Audio ==========
volume "0.2"
snd_mixahead "0.05"
snd_musicvolume "0"
snd_deathcamera_volume "0"
snd_mapobjective_volume "0"
snd_menumusic_volume "0"
snd_roundend_volume "0"
snd_roundstart_volume "0"
snd_tensecondwarning_volume "0.15"
windows_speaker_config "1"
dsp_enhance_stereo "0"

// ========== Video / Performance ==========
fps_max "0"
fps_max_tools "0"
cl_threaded_bone_setup "1"
cl_threaded_client_leaf_system "1"
func_break_max_pieces "0"
r_threaded_client_shadow_manager "1"
r_threaded_particles "1"
r_threaded_renderables "1"
r_eyegloss "0"
r_eyemove "0"
r_eyeshift_x "0"
r_eyeshift_y "0"
r_eyeshift_z "0"
r_eyesize "0"
r_dynamic "0"

// ========== Net / Rates ==========
rate "786432"
cl_updaterate "128"
cl_cmdrate "128"
cl_interp "0"
cl_interp_ratio "1"
cl_lagcompensation "1"

// ========== Binds ==========
// Movement
bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "space" "+jump"
bind "ctrl" "+duck"
bind "shift" "+speed"

// Buy binds (numpad)
bind "kp_end" "buy ak47; buy m4a1;"
bind "kp_downarrow" "buy awp;"
bind "kp_pgdn" "buy deagle;"
bind "kp_leftarrow" "buy vesthelm; buy vest;"
bind "kp_5" "buy hegrenade;"
bind "kp_rightarrow" "buy flashbang;"
bind "kp_home" "buy smokegrenade;"
bind "kp_uparrow" "buy molotov; buy incgrenade;"
bind "kp_ins" "buy defuser;"

// Utility
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"

// Communication
bind "v" "+voicerecord"
bind "y" "say"
bind "u" "say_team"
bind "TAB" "+showscores"

// Jump throw alias (must be enabled with +jumpthrow launch option or manual)
alias "+jumpthrow" "+jump;-attack"
alias "-jumpthrow" "-jump"
bind "alt" "+jumpthrow"

// ========== Misc ==========
cl_autohelp "0"
cl_disablehtmlmotd "1"
cl_freezecameffects_showholiday "0"
gameinstructor_enable "0"
option_duck_method "0"
option_speed_method "0"
cl_showloadout "1"
closeonbuy "0"

echo "================================="
echo " autoexec.cfg loaded successfully"
echo "================================="
host_writeconfig
